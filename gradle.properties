# Disable the Gradle Daemon.  (MANDATORY - see AGENTS.md section 2.1)
#
# Primary reason: AI agents trigger builds repeatedly within a session, often with
# differing arguments / JVM args. Gradle spawns a *separate* daemon per incompatible
# configuration and each one lingers (default idle timeout 3h), so daemons pile up,
# consume tens of GiB and eventually OOM the machine.
# Secondary reason: on Windows, a resident daemon holds file locks under build/ and
# the Gradle user home, breaking `clean`, IDE sync and concurrent builds.
#
# Trade-off: every build re-pays JVM start + configuration cost. Accepted on purpose.
#
# AI agents must STILL pass --no-daemon explicitly; do not rely on this file.
# Do NOT set this back to true.
org.gradle.daemon=false

# JDK 25 toolchain. The project requires JavaLanguageVersion.of(25) (see build.gradle),
# and this is the only JDK 25 installed on this machine, so point Gradle at it
# explicitly instead of relying on auto-detection or JAVA_HOME.
# Do NOT replace this with a JDK 21 path - the toolchain requirement is 25.
org.gradle.java.installations.paths=E:/Program Files/Java/jdk-25
